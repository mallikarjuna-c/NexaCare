services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexacare
      POSTGRES_PASSWORD: nexacare
      POSTGRES_DB: nexacare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexacare -d nexacare"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexacare:nexacare@db:5432/nexacare}
    volumes:
      - ./data:/app/data
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
